<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTER. — Payout memory</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet"><style>:root{--bg:#f3f5f1;--ink:#103c32;--muted:#6d7d77;--line:#d6dfda;--green:#075b49;--paper:#fffefa;--lime:#d9ff36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 28px 90px}.top{display:flex;justify-content:space-between}.top a{color:inherit;text-decoration:none;font-size:13px;font-weight:600}.mark{font-weight:700;letter-spacing:.1em}.hero{padding:90px 0 55px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--green)}h1{font:500 clamp(4rem,8vw,8rem)/.85 Newsreader,Georgia,serif;letter-spacing:-.06em;margin:18px 0}.hero p{color:var(--muted);max-width:620px}.history{padding-top:36px}.empty{padding:40px 0;color:var(--muted)}.record{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1.5fr;gap:18px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.period{font-weight:600}.big{font:500 30px/1 Newsreader,Georgia,serif}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.decision{font-size:13px}.delta{font-weight:600}.footer{margin-top:45px;padding:25px;background:var(--green);color:white;border-radius:18px}.footer strong{color:var(--lime)}@media(max-width:800px){.record{grid-template-columns:1fr 1fr}.decision{grid-column:1/-1}.hero{padding-top:70px}}</style></head><body><main class="wrap"><header class="top"><div class="mark">AFTER.</div><a href="/demo.html">← Back to payout</a></header><section class="hero"><div class="eyebrow">Memory</div><h1>Next time,<br>we remember.</h1><p>AFTER. keeps the useful part of each payout — totals, outcomes and the decision you made — so the next one can tell you what changed.</p></section><section class="history"><div class="eyebrow">Saved payouts</div><div id="list"></div></section><div class="footer">The product loop is simple: <strong>payout → decision → test → next payout → learning.</strong></div></main><script>const list=document.querySelector('#list'),items=JSON.parse(localStorage.getItem('after_payouts')||'[]');if(!items.length){list.innerHTML='<div class="empty">No payout saved yet. Run the demo, then save it here.</div>'}else{list.innerHTML=items.map((x,i)=>{const prev=items[i+1],delta=prev?x.keptPct-prev.keptPct:null;return '<article class="record"><div><div class="label">Period</div><div class="period">'+x.from+' → '+x.to+'</div></div><div><div class="label">Kept / ₹100</div><div class="big">₹'+Number(x.keptPct).toFixed(1)+'</div></div><div><div class="label">Orders</div><div class="big">'+x.orders+'</div></div><div><div class="label">Change</div><div class="delta">'+(delta==null?'First saved payout':(delta>=0?'+':'')+delta.toFixed(1)+' pts')+'</div></div><div><div class="label">Last decision</div><div class="decision">'+x.decision+'</div></div></article>'}).join('')}</script></body></html>
